model_parameters:
  onnx_model: osnet_x1_0_128x256.onnx
  march: nash-e
  output_model_file_prefix: osnet_x1_0_128x256_nashe

input_parameters:
  input_name: input
  input_shape: 1x3x256x128
  input_layout_train: NCHW
  input_type_train: featuremap
  input_type_rt: featuremap

calibration_parameters:
  cal_data_dir: calib_data
  calibration_type: default

compiler_parameters:
  optimize_level: O2
  compile_mode: latency
  core_num: 2
